<div class="grid p-fluid">

  <div class="col-12 lg:col-6 xl:col-3" *ngIf="showBilling()">
    <div class="card mb-0 shadow-2 surface-card border-round p-3">
      <div class="flex justify-content-between mb-3">
        <div>
          <span class="block text-500 font-medium mb-3">Revenue Today</span>
          <div class="text-900 font-bold text-xl">$2,100</div>
        </div>
        <div class="flex align-items-center justify-content-center bg-blue-100 border-round"
          style="width:2.5rem;height:2.5rem">
          <i class="pi pi-dollar text-blue-500 text-xl"></i>
        </div>
      </div>
      <span class="text-green-500 font-medium">24% </span>
      <span class="text-500">since yesterday</span>
    </div>
  </div>

  <div class="col-12 xl:col-6" *ngIf="showFrontDesk()">
    <div class="card shadow-2 surface-card border-round p-4">
      <div class="flex justify-content-between align-items-center mb-5">
        <h5>Patient Check-in Queue</h5>
        <span class="p-input-icon-left w-full sm:w-20rem">
          <i class="pi pi-search"></i>
          <input pInputText type="text" placeholder="Search patient..." class="w-full" />
        </span>
      </div>
      <p-table [value]="arrivedPatients" [rows]="5" responsiveLayout="scroll">
        <ng-template pTemplate="header">
          <tr>
            <th>Patient</th>
            <th>Arrived At</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-p>
          <tr>
            <td>{{p.name}}</td>
            <td>{{p.time}}</td>
            <td><span class="customer-badge status-arrived">Arrived</span></td>
            <td><button pButton icon="pi pi-sign-in" class="p-button-text"></button></td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>

  <div class="col-12 xl:col-6" *ngIf="showProvider()">
    <div class="card shadow-2 surface-card border-round p-4">
      <h5>Today's Schedule</h5>
      <ul class="list-none p-0 m-0">
        <li class="flex flex-column md:flex-row md:align-items-center md:justify-content-between mb-4">
          <div>
            <span class="text-900 font-medium mr-2 mb-1 md:mb-0">9:30 AM - Patient Exam</span>
            <div class="mt-1 text-600">Sarah Jenkins</div>
          </div>
          <div class="mt-2 md:mt-0 flex align-items-center">
            <button pButton label="Start Visit" class="p-button-outlined p-button-sm"></button>
          </div>
        </li>
      </ul>
    </div>
  </div>

  <div class="col-12" *ngIf="showBilling()">
    <div class="card shadow-2 surface-card border-round p-4">
      <h5>Weekly Revenue Overview</h5>
      <p-chart type="line" [data]="revenueData"></p-chart>
    </div>
  </div>
</div>
