<div class="signup-body">
  <div class="signup-card shadow-8">
    <div class="auth-tabs" role="tablist" aria-label="Authentication pages">
      <a role="tab" class="auth-tab" routerLink="/login" routerLinkActive="auth-tab-active"
        [routerLinkActiveOptions]="{ exact: true }">
        Login
      </a>
      <a role="tab" class="auth-tab" routerLink="/signup" routerLinkActive="auth-tab-active"
        [routerLinkActiveOptions]="{ exact: true }">
        Sign Up
      </a>
    </div>

    <div class="signup-header">
      <div class="hpms-logo" aria-hidden="true"></div>
      <h1 class="signup-title">Clinic Onboarding</h1>
      <p class="signup-subtitle">New clinics are provisioned by an HPMS System Administrator</p>
    </div>

    <div class="signup-form p-fluid">
      <p class="form-error" style="color: var(--text-color); margin-bottom: 1.5rem;">
        Public self-registration is disabled. A System Administrator creates the clinic tenant and the first
        Clinic Admin account. If you already have credentials, sign in below.
      </p>

      <a routerLink="/login" class="w-full">
        <p-button type="button" label="Go to Login" styleClass="w-full hpms-btn-accent"></p-button>
      </a>
    </div>
  </div>
</div>
